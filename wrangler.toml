name = "wangyun-party-game"
main = "src/worker.ts"
compatibility_date = "2026-09-16"

[assets]
directory = "./party-game/dist"
binding = "ASSETS"
run_worker_first = ["/api/*"]

[[durable_objects.bindings]]
name = "ROOMS"
class_name = "RoomDurableObject"

[[migrations]]
tag = "v1"
new_sqlite_classes = ["RoomDurableObject"]

[build]
command = "npm install --prefix party-game && npm run build --prefix party-game"
